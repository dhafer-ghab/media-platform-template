name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  all-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        run: dotnet test --no-build --configuration Release

      - name: Audit dependencies
        run: dotnet list package --vulnerable --include-transitive --no-restore

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: AstroFrontend
    env:
      PUBLIC_SITE_URL: https://frontend.example.invalid
      PUBLIC_API_BASE_URL: https://api.example.invalid
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: AstroFrontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check frontend
        run: npm run check
      - name: Build frontend
        run: npm run build
      - name: Audit dependencies
        run: npm run audit

  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f src/Host.WebApi/Dockerfile -t media-platform-api:test .
